name: Chore
description: Maintenance, setup, tooling or housekeeping with no behaviour change.
title: "[chore/<area>] "
labels: ["type/chore"]
projects: ["rahulgtt/3"]
body:
  - type: input
    id: parent
    attributes:
      label: Related story or epic
      placeholder: "Part of #"
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What needs doing and why.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      value: |
        - [ ]
  - type: markdown
    attributes:
      value: "Replace `<area>` in the title with the primary area (ml, controller, warmer, protocol-cufs, telemetry-data, performance, infra, docs) and add the matching `area/*` label(s)."
