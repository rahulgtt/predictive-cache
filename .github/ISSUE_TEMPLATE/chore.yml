name: Chore
description: Maintenance, setup, tooling or housekeeping with no behaviour change.
title: "[Chore]: "
labels: ["type/chore"]
projects: ["rahulgtt/3"]
body:
  - type: input
    id: parent
    attributes:
      label: Related story or epic
      placeholder: "Part of #"
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What needs doing and why.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      value: |
        - [ ]
  - type: markdown
    attributes:
      value: "Add at least one `area/*` label after creating the issue."
