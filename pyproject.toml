[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "predictive-cache"
version = "0.1.0"
description = "Synthetic access-event foundation for Predictive Cache"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2,<3", "pyarrow>=19,<24", "pydantic>=2.10,<3", "pyyaml>=6,<7", "click>=8.1,<9"]

[project.optional-dependencies]
clearml = ["clearml>=2.1,<2.2"]
ml = ["scikit-learn>=1.5,<2", "lightgbm>=4.5,<5"]
warmer = [
    "pynfs @ git+https://github.com/truenas/pynfs.git@87b2d81d0b38ec7a9d73b7d38bf9559b73b853d9",
]

[project.scripts]
pcache-clearml-datagen = "predictive_cache.clearml.datagen:main"
pcache-clearml-clean = "predictive_cache.clearml.clean:main"
pcache-datagen = "predictive_cache.datagen.cli:main"
pcache-chimera-import = "predictive_cache.sources.chimera.cli:main"
pcache-collect = "predictive_cache.collection.cli:main"
pcache-prep = "predictive_cache.prep.cli:main"
pcache-controller = "predictive_cache.controller.cli:main"
pcache-dispatcher = "predictive_cache.dispatcher.cli:main"
pcache-model = "predictive_cache.ml.cli:main"
pcache-train = "predictive_cache.ml.train_cli:main"
pcache-eval = "predictive_cache.ml.eval_cli:main"
pcache-warmer = "predictive_cache.warmer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "pynfs @ git+https://github.com/truenas/pynfs.git@87b2d81d0b38ec7a9d73b7d38bf9559b73b853d9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/predictive_cache"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = [
    "tests/collection",
    "tests/controller",
    "tests/datagen",
    "tests/dispatcher",
    "tests/ml",
    "tests/prep",
    "tests/sources",
    "tests/warmer",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
